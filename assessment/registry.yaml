# Pattern registry — scoring metadata for the Databricks pattern library.
#
# Titles and anti-pattern flags are NOT stored here; they are read from
# the markdown files at load time so the two can never disagree.
# `id` matches the markdown filename stem, `cat` the directory name.
#
# sev    CRITICAL | HIGH | MEDIUM | LOW      -> weight via severity_weights
# tier   SYSTEM_TABLE  pure SQL over system.*        (implementable now)
#        TABLE_DETAIL  needs DESCRIBE DETAIL per table (expensive, per-object)
#        WORKSPACE_API  Genie / Dashboards / Workspace / Git / grants
#        ACCOUNT_API    account console or Account API
#        REPO_SCAN      source control or notebook export scan
#        MANUAL         design judgment; requires a conversation
# impl   true when a collector check exists; false emits NOT_AVAILABLE
# target conformance % at or above which the check grades GOOD
# floor  conformance % below which the check grades POOR
# applies ALWAYS | IF_ML | IF_GENAI | IF_STREAMING | IF_SHARING | IF_MULTI_WORKSPACE
# cause  root-cause grouping key, so overlapping patterns roll up

version: "1.0.0"

severity_weights:
  CRITICAL: 5.0
  HIGH: 3.0
  MEDIUM: 2.0
  LOW: 1.0

confidence_thresholds:
  HIGH: 70.0
  MEDIUM: 40.0

