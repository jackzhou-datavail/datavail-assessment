# Databricks Asset Bundle — Datavail Platform Assessment
#
# Deliberately a SEPARATE bundle from the repo-root databricks.yml: its own
# bundle name (so its own Terraform state and workspace folder), its own
# resource keys, its own schedule. Deploying this never touches the
# resources the root bundle owns, and vice versa.
#
# Provisions ONE job that runs the assessment collector and writes to the
# results catalog, plus TWO dashboards that read what it wrote. A dashboard
# reads the latest COMPLETE run, so refreshed data needs no redeploy — only a
# change to a generator does.
#
# This job is an ADDITIONAL entry point, not a replacement. Running the
# collector locally stays fully supported and is unaffected by deploying
# or destroying this bundle:
#
#   python -m src.conformance.run --profile <p> --warehouse-id <id>
#
# The local path needs no cluster and no pyspark; this job runs the same
# checks on serverless compute. Both append a new run_id to the same
# tables, and the dashboard reads whichever ran most recently.
#
# ── Deploy ─────────────────────────────────────────────────────────────────
#   databricks bundle deploy -p <profile> --var warehouse_id=<id>
#   databricks bundle run platform_assessment_collect -p <profile> --var warehouse_id=<id>
#
# The schedule below is PAUSED on purpose. Deploying will not start
# collecting on its own — unpause it once you have seen a manual run pass.
# ───────────────────────────────────────────────────────────────────────────

bundle:
  name: platform-assessment

variables:
  results_catalog:
    description: "Dedicated catalog for assessment output. Always excluded from assessment scope."
    default: "assessment"
  results_schema:
    description: "Schema within the results catalog"
    default: "results"
  lookback_days:
    description: "Observation window in days for activity-based checks"
    default: "30"
  warehouse_id:
    description: "SQL Warehouse ID that backs the dashboard. The collector jobs use serverless compute and ignore this. Required: pass --var warehouse_id=<id>"
  alert_email:
    description: "Where job failures are sent. Use a group alias, not a person."
    default: ""

# The bundle root is the repo root, so src/ and patterns/ both sync by
# default. patterns/ is required: the registry reads pattern titles from the
# markdown, and without it the dashboard's Pattern column falls back to ids.

# The collector ships as a wheel, installed by the job environment below.
# job_entry.py is a three-line launcher that imports it: an exec()d script has
# no __file__, so the code it calls into must not depend on one.
artifacts:
  collector_wheel:
    type: whl
    path: .
    build: pip wheel . -w dist --no-deps

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    # Production runs should use a service principal, not a named person —
    # see patterns/platform-onboarding/service-principals-for-automation.md
    # run_as:
    #   service_principal_name: "<application-id>"

resources:
  jobs:
    platform_assessment_collect:
      name: "Datavail Assessment — Collect"
      description: >-
        Produces every dataset the Datavail Assessment dashboard reads. The two
        assessments answer different questions and share nothing at runtime, so
        they run in parallel and one failing does not block the other.

      tasks:
        # --spark selects the Spark executor. --patterns-dir points at the
        # directory the bundle synced; the pattern library is repo data that
        # people edit, so it is not packaged into the wheel. The registry IS
        # package data, so it needs no flag.
        - task_key: collect
          spark_python_task:
            python_file: ./job_conformance.py
            parameters:
              - "--spark"
              - "--results-catalog"
              - "${var.results_catalog}"
              - "--results-schema"
              - "${var.results_schema}"
              - "--lookback-days"
              - "${var.lookback_days}"
              - "--patterns-dir"
              - "${workspace.file_path}/patterns"
          environment_key: collector
          # Transient system-table read failures are worth retrying; a wrong
          # query is not, so keep this low. See
          # patterns/orchestration-reliability/retries-and-timeouts-on-every-task.md
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 3600

        # Adoption needs no pattern library: its checks are self-contained,
        # so it takes neither --patterns-dir nor --lookback-days.
        - task_key: collect_adoption
          spark_python_task:
            python_file: ./job_adoption.py
            parameters:
              - "--spark"
              - "--results-catalog"
              - "${var.results_catalog}"
              - "--results-schema"
              - "${var.results_schema}"
          environment_key: collector
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 3600

      environments:
        - environment_key: collector
          spec:
            client: "4"
            # The registry loader falls back to its own parser when PyYAML is
            # absent, so PyYAML is listed only for better errors on a
            # malformed registry.
            dependencies:
              - ./dist/*.whl
              - "pyyaml>=6.0"

      # Weekly. Assessment drift is a slow signal; daily adds cost without
      # adding information.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "UTC"
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - "${var.alert_email}"

      # A run that overlaps itself would write two rows for the same period.
      max_concurrent_runs: 1

      tags:
        purpose: platform-assessment
        owner: datavail

  # ── Dashboard ────────────────────────────────────────────────────────────
  # Generated by `python -m datavail_assessment.dashboard.build`. Edit the
  # generator, not the dashboard in the UI: once the bundle owns it, a UI edit
  # makes the next deploy fail rather than silently lose the change, and
  # recovering means `bundle generate` or --force.
  dashboards:
    datavail_assessment:
      display_name: "Datavail Assessment"
      file_path: ./src/datavail_assessment/dashboard/datavail_assessment.lvdash.json
      warehouse_id: ${var.warehouse_id}

    # The three-page conformance dashboard, generated by
    # `python -m datavail_assessment.conformance.dashboard.build`. Same builder
    # the Datavail Assessment "Conformance" page lifts its scorecard from, so
    # the two cannot disagree — this one simply shows all three pages rather
    # than only the first.
    conformance_assessment:
      display_name: "Conformance Assessment"
      file_path: ./src/datavail_assessment/conformance/dashboard/conformance_assessment.lvdash.json
      warehouse_id: ${var.warehouse_id}
