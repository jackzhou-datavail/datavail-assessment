# Databricks Asset Bundle — Datavail Assessment Demo
#
# Provisions: AI/BI Dashboard + setup job (data gen → Genie deploy).
# No SDP pipeline (data generated via Python SDK).
# No Databricks App. No Lakebase.
#
# ── 2-command deploy ───────────────────────────────────────────────────────
#   1. databricks bundle deploy  --var catalog=<your-catalog> \
#                                --var schema=<your-schema> \
#                                --var warehouse_id=<your-warehouse-id>
#   2. databricks bundle run datavail_assessment_setup  --var ...
# ──────────────────────────────────────────────────────────────────────────

bundle:
  name: datavail-assessment

variables:
  catalog:
    description: "Unity Catalog for demo resources"
    default: "main"
  schema:
    description: "Schema within the catalog"
    default: "assessment_data"
  warehouse_id:
    description: "SQL Warehouse ID — powers the dashboard + Genie space (no default: pass --var warehouse_id=<id>)"

sync:
  include:
    - "src/**"
    - "data_generation/**"
  exclude:
    - "app/**"
    - "**/__pycache__/**"

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production

resources:
  # ──────────────────────────────────────────────────────────────────────────
  # AI/BI Dashboard — deployed by `bundle deploy`.
  # dataset_catalog / dataset_schema rebind the embedded queries per-target.
  # ──────────────────────────────────────────────────────────────────────────
  dashboards:
    datavail_assessment_dashboard:
      display_name: "[${bundle.target}] Datavail Assessment"
      file_path: ./src/dashboard/dashboard.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}

  # ──────────────────────────────────────────────────────────────────────────
  # Setup job — runs AFTER `bundle deploy`.
  #   generate_data   → synthetic workspace metadata into UC tables
  #   deploy_genie    → creates / updates the Genie space (not declarable)
  # ──────────────────────────────────────────────────────────────────────────
  jobs:
    datavail_assessment_setup:
      name: "[${bundle.target}] Datavail Assessment Setup"
      description: "generate synthetic data → deploy Genie space"
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./data_generation/generate_data.py
            base_parameters:
              catalog:      ${var.catalog}
              schema:       ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: sdk_default

        - task_key: deploy_genie
          depends_on: [{ task_key: generate_data }]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog:      ${var.catalog}
              schema:       ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: sdk_latest

      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - "faker"
              - "databricks-sdk>=0.114.0"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
